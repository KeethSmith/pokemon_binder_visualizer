name: Refresh TCGplayer prices

on:
  workflow_dispatch:
  schedule:
    - cron: "35 21 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh prices and rebuild site
        run: |
          python scripts/update_tcgplayer_prices.py
          python por_binder_generator.py
          python -m unittest discover -s tests
      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/tcgplayer.json index.html
          git diff --cached --quiet || git commit -m "Refresh TCGplayer prices"
          git push
